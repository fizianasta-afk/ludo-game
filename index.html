<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Ludo Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <h1>🎲 LUDO GAME</h1>

        <div class="ludo-board">

            <!-- RUMAH MERAH -->
            <div class="house red-house">
                <div class="house-title">🔴</div>

                <div class="pieces">
                    <div class="piece red-piece"></div>
                    <div class="piece red-piece"></div>
                    <div class="piece red-piece"></div>
                    <div class="piece red-piece"></div>
                </div>
            </div>


            <!-- JALUR ATAS -->
            <div class="path top-path">

                <div></div>
                <div></div>
                <div></div>
                <div class="green-path"></div>
                <div class="green-path"></div>
                <div></div>

                <div></div>
                <div></div>
                <div></div>
                <div class="green-path"></div>
                <div class="green-path"></div>
                <div></div>

            </div>


            <!-- RUMAH HIJAU -->
            <div class="house green-house">

                <div class="house-title">🟢</div>

                <div class="pieces">

                    <div class="piece green-piece"></div>
                    <div class="piece green-piece"></div>
                    <div class="piece green-piece"></div>
                    <div class="piece green-piece"></div>

                </div>

            </div>


            <!-- JALUR KIRI -->

            <div class="path left-path">

                <div></div>
                <div></div>
                <div class="red-path"></div>
                <div></div>
                <div></div>

                <div></div>
                <div></div>
                <div class="red-path"></div>
                <div></div>
                <div></div>

                <div></div>
                <div></div>
                <div class="red-path"></div>
                <div></div>
                <div></div>

            </div>


            <!-- TENGAH -->

            <div class="finish">

                <div class="finish-red"></div>
                <div class="finish-green"></div>
                <div class="finish-yellow"></div>
                <div class="finish-blue"></div>

                <span>🏆</span>

            </div>


            <!-- JALUR KANAN -->

            <div class="path right-path">

                <div></div>
                <div></div>
                <div class="yellow-path"></div>
                <div></div>
                <div></div>

                <div></div>
                <div></div>
                <div class="yellow-path"></div>
                <div></div>
                <div></div>

                <div></div>
                <div></div>
                <div class="yellow-path"></div>
                <div></div>
                <div></div>

            </div>


            <!-- RUMAH BIRU -->

            <div class="house blue-house">

                <div class="house-title">🔵</div>

                <div class="pieces">

                    <div class="piece blue-piece"></div>
                    <div class="piece blue-piece"></div>
                    <div class="piece blue-piece"></div>
                    <div class="piece blue-piece"></div>

                </div>

            </div>


            <!-- JALUR BAWAH -->

            <div class="path bottom-path">

                <div></div>
                <div></div>
                <div></div>
                <div class="blue-path"></div>
                <div class="blue-path"></div>
                <div></div>

                <div></div>
                <div></div>
                <div></div>
                <div class="blue-path"></div>
                <div class="blue-path"></div>
                <div></div>

            </div>


            <!-- RUMAH KUNING -->

            <div class="house yellow-house">

                <div class="house-title">🟡</div>

                <div class="pieces">

                    <div class="piece yellow-piece"></div>
                    <div class="piece yellow-piece"></div>
                    <div class="piece yellow-piece"></div>
                    <div class="piece yellow-piece"></div>

                </div>

            </div>

        </div>


        <!-- DADU -->

        <div class="controls">

            <div id="dice">
                🎲
            </div>

            <button onclick="rollDice()">
                LEMPAR DADU
            </button>

            <p id="turn">
                Giliran 🔴
            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
