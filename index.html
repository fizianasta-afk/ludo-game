<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ludo Game</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="game">

        <h1 class="title">
            🎲 LUDO GAME
        </h1>

        <div class="board">

            <!-- MERAH -->

            <div class="home red">

                <div class="tokens">

                    <div class="token"></div>
                    <div class="token"></div>
                    <div class="token"></div>
                    <div class="token"></div>

                </div>

            </div>


            <!-- HIJAU -->

            <div class="home green">

                <div class="tokens">

                    <div class="token"></div>
                    <div class="token"></div>
                    <div class="token"></div>
                    <div class="token"></div>

                </div>

            </div>


            <!-- TENGAH -->

            <div class="center">

                <div class="center-box">

                    <div class="center-text">
                        🏆
                    </div>

                </div>

            </div>


            <!-- KUNING -->

            <div class="home yellow">

                <div class="tokens">

                    <div class="token"></div>
                    <div class="token"></div>
                    <div class="token"></div>
                    <div class="token"></div>

                </div>

            </div>


            <!-- BIRU -->

            <div class="home blue">

                <div class="tokens">

                    <div class="token"></div>
                    <div class="token"></div>
                    <div class="token"></div>
                    <div class="token"></div>

                </div>

            </div>

        </div>


        <!-- DADU -->

        <div class="controls">

            <div class="dice">
                🎲
            </div>

            <button>
                LEMPAR DADU
            </button>

            <p class="info">
                Giliran pemain 🔴
            </p>

        </div>

    </div>

</body>

</html>
